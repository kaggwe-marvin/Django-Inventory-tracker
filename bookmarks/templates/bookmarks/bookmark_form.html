<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Bookmark</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="url"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { background: #0066cc; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; }
        .cancel { color: #666; margin-left: 10px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>➕ Add New Bookmark</h1>
    <hr>
    
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p style="color: red;">{{ field.errors.as_text }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn">Save Bookmark</button>
        <a href="{% url 'bookmarks:list' %}" class="cancel">Cancel</a>
    </form>
</body>
</html>
